<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>맹고</title>
    <!--
      웹(server.url)을 못 불러올 때 Capacitor가 띄우는 안내 화면(capacitor.config.ts의 errorPath).
      연결이 없을 때가 대부분이지만, 안드로이드는 첫 화면이 HTTP 오류여도 여기로 온다. 그래서 문구를 넓게 쓴다.
      이 파일은 원본이고, cap sync 때 capacitor.config.ts가 서버 주소를 넣어 www/index.html로 만든다.
      안드로이드는 이 화면에 Capacitor 플러그인이 없고 같은 폴더의 다른 파일도 못 읽으므로 파일 하나에 순수 HTML·JS만 쓴다.
    -->
    <style>
      :root {
        --ink: #1f2340;
        --sub: #6b7089;
        --mango: #ffc23d;
        --mango-dark: #e09a12;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); }
      body {
        /* -apple-system·system-ui를 앞에 두면 영어 설정 iOS(26 시뮬레이터에서 확인)에서 한글이 다음 글꼴로 넘어가지 않고 네모로 나온다 */
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
        text-align: center;
      }
      svg { width: 88px; height: 88px; }
      h1 { margin: 24px 0 0; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
      p { margin: 8px 0 0; font-size: 16px; font-weight: 600; line-height: 1.5; color: var(--sub); word-break: keep-all; }
      button {
        margin-top: 32px;
        min-width: 200px;
        min-height: 52px;
        padding: 0 22px;
        border: 0;
        border-radius: 16px;
        background: var(--mango);
        color: var(--ink);
        font: inherit;
        font-size: 16px;
        font-weight: 800;
        box-shadow: 0 4px 0 var(--mango-dark);
        transition: transform 80ms ease-out, box-shadow 80ms ease-out;
      }
      button:active { transform: translateY(4px); box-shadow: 0 0 0 var(--mango-dark); }
      button:disabled { opacity: 0.6; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <rect width="200" height="200" rx="45" fill="#FFC23D" />
        <path d="M200 105 L200 155 Q200 200 155 200 L80 200 C140 196 190 160 200 105 Z" fill="#FF9F2E" />
        <ellipse cx="44" cy="58" rx="11" ry="22" transform="rotate(-35 44 58)" fill="#FFE08A" />
        <rect x="110" y="28" width="9" height="17" rx="3" transform="rotate(20 114 36)" fill="#7A4A2A" />
        <path d="M118 40 C130 14 164 6 184 14 C174 38 144 50 118 40 Z" fill="#34B36A" />
        <path d="M123 38 C140 30 160 22 178 16" fill="none" stroke="#23914F" stroke-width="3.5" stroke-linecap="round" />
        <circle cx="70" cy="110" r="22" fill="#FFFFFF" />
        <circle cx="130" cy="110" r="22" fill="#FFFFFF" />
        <circle cx="74" cy="114" r="11" fill="#191C32" />
        <circle cx="126" cy="114" r="11" fill="#191C32" />
        <circle cx="78" cy="108" r="3.5" fill="#FFFFFF" />
        <circle cx="130" cy="108" r="3.5" fill="#FFFFFF" />
        <ellipse cx="50" cy="143" rx="11" ry="7" fill="#FF6F61" opacity="0.45" />
        <ellipse cx="150" cy="143" rx="11" ry="7" fill="#FF6F61" opacity="0.45" />
        <path d="M86 142 Q100 156 114 142" fill="none" stroke="#191C32" stroke-width="6" stroke-linecap="round" />
      </svg>
      <h1>맹고를 불러오지 못했어요</h1>
      <p>인터넷 연결을 확인하고<br />다시 시도해 주세요.</p>
      <button type="button" id="retry">다시 시도</button>
    </main>
    <script>
      (function () {
        var url = __SERVER_URL__;
        var button = document.getElementById("retry");
        function retry() {
          button.disabled = true;
          button.textContent = "불러오는 중…";
          // 안내 화면을 기록에 남기지 않는다(뒤로 가기로 다시 오지 않게)
          location.replace(url + "/");
        }
        button.addEventListener("click", retry);

        // 연결이 돌아오면 저절로 다시 불러온다. online 이벤트는 iOS만 오고(안드로이드 웹뷰는 앱이 알려 줘야 한다),
        // 그래서 서버에 닿는지 3초마다 직접 확인한다. 처음부터 닿으면(안드로이드의 HTTP 오류) 되풀이하지 않게 버튼만 둔다
        window.addEventListener("online", retry);
        function reachable() {
          return fetch(url + "/", { mode: "no-cors", cache: "no-store" }).then(
            function () { return true; },
            function () { return false; }
          );
        }
        reachable().then(function (ok) {
          if (ok) return;
          var timer = setInterval(function () {
            reachable().then(function (ok) {
              if (!ok) return;
              clearInterval(timer);
              retry();
            });
          }, 3000);
        });
      })();
    </script>
  </body>
</html>
