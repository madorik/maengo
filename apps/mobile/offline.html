<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>맹고</title>
    <!--
      웹(server.url)을 못 불러올 때 Capacitor가 띄우는 안내 화면(capacitor.config.ts의 errorPath).
      연결이 없을 때가 대부분이지만, 안드로이드는 첫 화면이 HTTP 오류여도 여기로 온다. 그래서 문구를 넓게 쓴다.
      이 파일은 원본이고, cap sync 때 capacitor.config.ts가 서버 주소를 넣어 www/index.html로 만든다.
      안드로이드는 이 화면에 Capacitor 플러그인이 없고 같은 폴더의 다른 파일도 못 읽으므로 파일 하나에 순수 HTML·JS만 쓴다.
    -->
    <style>
      :root {
        --paper: #fff;
        --ink: #1f2340;
        --sub: #6b7089;
        --mango: #ffc23d;
        --mango-dark: #e09a12;
      }
      /* 기기가 다크 모드면 웹의 다크 색(apps/web/app/globals.css)과 같게. 버튼 글자는 망고 위라 남색 그대로 */
      @media (prefers-color-scheme: dark) {
        :root { --paper: #151722; --text: #eceef5; --sub: #a6abc0; }
        html, body { color: var(--text) !important; }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
      body {
        /* -apple-system·system-ui를 앞에 두면 영어 설정 iOS(26 시뮬레이터에서 확인)에서 한글이 다음 글꼴로 넘어가지 않고 네모로 나온다 */
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
        text-align: center;
      }
      svg { width: 88px; height: 88px; }
      h1 { margin: 24px 0 0; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; }
      p { margin: 8px 0 0; font-size: 16px; font-weight: 600; line-height: 1.5; color: var(--sub); word-break: keep-all; }
      button {
        margin-top: 32px;
        min-width: 200px;
        min-height: 52px;
        padding: 0 22px;
        border: 0;
        border-radius: 16px;
        background: var(--mango);
        color: var(--ink);
        font: inherit;
        font-size: 16px;
        font-weight: 800;
        box-shadow: 0 4px 0 var(--mango-dark);
        transition: transform 80ms ease-out, box-shadow 80ms ease-out;
      }
      button:active { transform: translateY(4px); box-shadow: 0 0 0 var(--mango-dark); }
      button:disabled { opacity: 0.6; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <!-- 앱 아이콘 "소리 막대 망고"(2026-11-25, apps/web/app/icon.svg와 같은 그림) -->
        <rect width="120" height="120" rx="27" fill="#1B1F3B" />
        <rect x="25" y="58.5" width="10" height="28" rx="5" fill="#FFAA00" />
        <rect x="40" y="44.5" width="10" height="54" rx="5" fill="#FFAA00" />
        <rect x="55" y="37.5" width="10" height="66" rx="5" fill="#FFAA00" />
        <rect x="70" y="42.5" width="10" height="56" rx="5" fill="#FFAA00" />
        <rect x="85" y="56.5" width="10" height="30" rx="5" fill="#FFAA00" />
        <path d="M64 32.5 C67 21.5 78 16.5 90 18.5 C87 29.5 76 34.5 64 32.5 Z" fill="#FFD27A" />
      </svg>
      <h1>맹고를 불러오지 못했어요</h1>
      <p>인터넷 연결을 확인하고<br />다시 시도해 주세요.</p>
      <button type="button" id="retry">다시 시도</button>
    </main>
    <script>
      (function () {
        var url = __SERVER_URL__;
        var button = document.getElementById("retry");
        function retry() {
          button.disabled = true;
          button.textContent = "불러오는 중…";
          // 안내 화면을 기록에 남기지 않는다(뒤로 가기로 다시 오지 않게)
          location.replace(url + "/");
        }
        button.addEventListener("click", retry);

        // 연결이 돌아오면 저절로 다시 불러온다. online 이벤트는 iOS만 오고(안드로이드 웹뷰는 앱이 알려 줘야 한다),
        // 그래서 서버에 닿는지 3초마다 직접 확인한다. 처음부터 닿으면(안드로이드의 HTTP 오류) 되풀이하지 않게 버튼만 둔다
        window.addEventListener("online", retry);
        function reachable() {
          return fetch(url + "/", { mode: "no-cors", cache: "no-store" }).then(
            function () { return true; },
            function () { return false; }
          );
        }
        reachable().then(function (ok) {
          if (ok) return;
          var timer = setInterval(function () {
            reachable().then(function (ok) {
              if (!ok) return;
              clearInterval(timer);
              retry();
            });
          }, 3000);
        });
      })();
    </script>
  </body>
</html>
